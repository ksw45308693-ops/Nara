# Install this file inside Nginx's http {} context before the server file.
# Empty keys are not counted, so GET /login remains available while password
# checks submitted by POST are bounded per client address.
map $request_method $g2b_login_limit_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $g2b_login_limit_key zone=g2b_login:10m rate=10r/m;
